[package]
name = "five-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Five Voice Assistant"]
description = "Voice assistant daemon for OpenClaw integration"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Audio (ALSA directly — no cpal abstraction layer)
alsa = "0.9"
rubato = "0.15"

# Wake word (pure Rust)
rustpotter = "3"
# Pin: rustpotter 3.0.2 pulls candle-core 0.2.2, which needs half's rand_distr
# impls against rand 0.8. half >= 2.5 retargeted those impls to rand 0.9 and
# broke the build. Remove this pin when rustpotter upgrades its candle dep.
half = "=2.4.1"

# Speech-to-text (Rust FFI bindings to whisper.cpp — same ggml models, no subprocess)
whisper-rs = "0.14"

# Audio file I/O
hound = "3.5"

# HTTP client (rustls — no system OpenSSL dependency)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Process management
nix = { version = "0.27", features = ["process"] }
kokoro-en = "0.1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
