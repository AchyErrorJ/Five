audio:
  alsa_card: 2
  alsa_device: 0
  sample_rate: 48000
  channels: 2
  format: "S24_3LE"
  target_rate: 16000
  target_channels: 1
  chunk_ms: 100

wakeword:
  model_path: "models/five.rpw"
  threshold: 0.6
  min_scores: 2
  avg_threshold: 0.0

transcription:
  model_path: "models/ggml-base.en.bin"
  command_duration_sec: 10
  sample_rate: 16000

openclaw:
  endpoint: "http://127.0.0.1:10000"
  timeout_sec: 30
  password: "CHANGE_ME"
  from_agent: "five"
  to_agent: "five"

ambient:
  enabled: false
  interval_min: 15
  duration_sec: 30
  log_dir: "/tmp/five/ambient"
  max_files: 100

voice:
  model_path: "models/kokoro/model.onnx"
  voices_dir: "voices"
  voice: "af_heart"
  speed: 1.0

captions:
  enabled: true

logging:
  level: "info"
  log_dir: "/tmp/five"
  max_size_mb: 10
  max_files: 5
