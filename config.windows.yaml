# five-daemon config for Windows (Legion Go).
# Uses the system default input/output devices via WASAPI; ALSA fields are
# omitted (they have serde defaults and are ignored on Windows).

audio:
  # input_device: "Microphone Array"   # uncomment to pick a specific mic;
  #                                     # substring match, case-sensitive
  # Windows default output is the Esinkin BT headphones — send replies to
  # the Realtek stereo speakers instead (substring match, case-insensitive).
  output_device: "Esinkin"
  target_rate: 16000
  target_channels: 1
  chunk_ms: 100

wakeword:
  # Text trigger: transcribe every utterance, fire on the word "five" in
  # the text. The .rpw model matched its training session's room tone, not
  # the word — whisper is the reliable detector.
  enabled: false
  model_path: "models/five.rpw"
  # Positives score 0.727+, music/speech negatives max 0.617 — 0.68 splits them
  threshold: 0.68
  min_scores: 2
  avg_threshold: 0.0

transcription:
  # tiny.en: ~4x faster than base.en on CPU (2-3s per utterance vs 9s) —
  # always-listening transcribes EVERY utterance, so speed beats accuracy
  # here; command phrases are short and survive tiny fine.
  model_path: "models/ggml-tiny.en.bin"
  command_duration_sec: 10
  sample_rate: 16000

openclaw:
  endpoint: "http://127.0.0.1:10000"
  timeout_sec: 30
  password: "CHANGE_ME"
  from_agent: "five"
  to_agent: "five"

ambient:
  enabled: false
  interval_min: 15
  duration_sec: 30
  log_dir: "logs/ambient"
  max_files: 100

voice:
  model_path: "models/kokoro/model.onnx"
  voices_dir: "voices"
  voice: "af_heart"
  speed: 1.1
  # DirectML on the AMD iGPU intermittently fails Kokoro's ConvTranspose
  # node (silence instead of speech) — CPU is fast enough and reliable.
  provider: "cpu"
  # TTS was too quiet over the stereo — 2.0 ≈ +6 dB through a soft limiter.
  gain: 2.0

captions:
  enabled: false   # desktop notifications not implemented on Windows yet

brain:
  enabled: true
  # "tutor" or "orchestrator" — both share the tool convention
  # (NOTE: writes to the notebook, ASK_BIG: escalates to Kimi).
  persona: "tutor"
  subject: "whatever the student is curious about"
  # Optional soul file: replaces the built-in persona above with your own
  # system prompt. Re-read every turn — edit it while Five runs. Uncomment:
  # soul_path: "soul.md"
  # Long-term memory, re-injected every turn. Edit by hand anytime.
  notebook_path: "notebook.md"
  local_url: "http://127.0.0.1:1234/v1"
  local_model: "google/gemma-4-e4b"
  # Context window of the loaded model. History scales proportionally:
  # 8K -> ~21 messages kept, 32K -> ~85 messages kept.
  context_window: 8192
  # Lesson plans: "make a lesson plan for X" asks Kimi to write a plan into
  # this folder; "start the lesson" has the local model teach it step by step.
  lesson_dir: "lessonplans"
  kimi_url: "https://api.kimi.com/coding/v1"
  kimi_model: "kimi-for-coding"
  kimi_key_file: "kimi-key.txt"   # git-ignored
  max_tokens: 512                  # replies are spoken — keep them small
  timeout_sec: 120
  # Named modes override base settings at runtime via voice command.
  # "Five, switch to dm mode" activates the dm profile below.
  modes:
    dm:
      context_window: 32768
      max_tokens: 2048
      persona: "tutor"
      local_model: "google/gemma-4-e4b"

# Smart home control via Home Assistant. Uncomment and fill in your HA URL
# and token to enable voice light/scene control.
#home:
#  url: "http://homeassistant.local:8123"
#  token: "YOUR_LONG_LIVED_ACCESS_TOKEN"
#  devices:
#    "living room light": "light.living_room"
#    "bedroom light": "light.bedroom"
#    "kitchen light": "light.kitchen"
#    "movie mode": "scene.movie_mode"

logging:
  level: "info"
  log_dir: "logs"
  max_size_mb: 10
  max_files: 5
